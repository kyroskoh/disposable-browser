name: disposable-browser

# Quickstart (build locally):
#   cp .env.example .env            # set DBROWSER_API_TOKEN
#   docker compose --profile build build
#   docker compose up -d            # dashboard: http://localhost:8080
# Or use the signed release images from GHCR: set DBROWSER_BROWSER_IMAGE and
# DBROWSER_CONTROLLER_IMAGE in .env, `docker pull` the browser image (the socket
# proxy doesn't let the controller pull images), then `docker compose up -d`.
# Optional remote access to the dashboard/MCP:
#   docker compose --profile cloudflare up -d    (needs CLOUDFLARE_TUNNEL_TOKEN)
#   docker compose --profile tailscale up -d     (needs TS_AUTHKEY)

services:
  # Build-only service so `docker compose --profile build build` tags the browser image
  # the controller launches per session.
  browser:
    profiles: [build]
    build: ./browser
    image: ${DBROWSER_BROWSER_IMAGE:-disposable-browser/browser:dev}

  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    image: ${DBROWSER_CONTROLLER_IMAGE:-disposable-browser/controller:dev}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DBROWSER_DOCKER_NETWORK: dbrowser
      DBROWSER_CDP_ACCESS: internal
      DBROWSER_WIREGUARD_PROFILES_DIR: /wg-profiles
      # The controller never touches the Docker socket; it talks to the filtering proxy.
      DOCKER_HOST: tcp://docker-proxy:2375
    ports:
      - "${DBROWSER_BIND:-127.0.0.1}:${DBROWSER_PORT:-8080}:8080"
    volumes:
      - ./wireguard:/wg-profiles:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on: [docker-proxy]
    networks: [dbrowser, docker-api]

  # Least-privilege Docker API (E-2): only the container endpoints (create, start,
  # inspect, logs, delete), ping and version. Image, volume, network, build, swarm,
  # secret and system endpoints are refused. It sits on an internal network that only
  # the controller joins, so browser sessions (on `dbrowser`) can't reach it.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      POST: 1
      EVENTS: 0
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt: [no-new-privileges:true]
    networks: [docker-api]

  # Publish the dashboard + MCP endpoint through a Cloudflare named tunnel.
  # In the Cloudflare dashboard route your hostname to http://controller:8080
  # and protect it with Cloudflare Access.
  cloudflared:
    profiles: [cloudflare]
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [controller]
    networks: [dbrowser]

  # Put the dashboard + MCP endpoint on your tailnet at https://dbrowser.<tailnet>.ts.net
  tailscale:
    profiles: [tailscale]
    image: tailscale/tailscale:v1.78.1
    restart: unless-stopped
    hostname: dbrowser
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./deploy/tailscale:/config:ro
      - tailscale-state:/var/lib/tailscale
    depends_on: [controller]
    networks: [dbrowser]

networks:
  dbrowser:
    name: dbrowser
  docker-api:
    internal: true

volumes:
  tailscale-state:
