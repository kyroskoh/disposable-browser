[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dbrowser"
version = "0.2.1"
description = "Disposable, privacy-first Chromium sessions for people and AI agents (REST + MCP)."
license = "MIT"
authors = [{ name = "Kyros Koh" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "docker>=7.1",
  "httpx>=0.27",
  "mcp>=2.3,<3",
  "playwright>=1.49",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6", "anyio>=4.4"]

[project.scripts]
dbrowser = "dbrowser.__main__:main"
dbrowser-mcp = "dbrowser.mcp_stdio:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dbrowser"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S104", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker and the built browser image"]
addopts = "-m 'not integration'"
