<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disposable Browser</title>
<style>
  :root {
    --bg: #f7f7f8; --surface: #ffffff; --text: #1b1b1f; --muted: #5f6068;
    --border: #dcdce0; --accent: #de5833; --accent-text: #ffffff; --danger: #b42318;
    --radius: 10px; --space: 8px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111114; --surface: #1b1b20; --text: #ececf1; --muted: #a0a0ab;
            --border: #2e2e36; --accent: #f0714d; --accent-text: #111114; --danger: #f97066; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: calc(var(--space) * 3) 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 calc(var(--space) * 3); }
  section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: calc(var(--space) * 2); margin-bottom: calc(var(--space) * 2); }
  h2 { font-size: 1rem; margin: 0 0 var(--space); }
  form { display: grid; gap: var(--space); grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); align-items: end; }
  label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
  input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
                  border-radius: 6px; padding: 8px 10px; min-height: 44px; width: 100%; }
  button { font: inherit; min-height: 44px; padding: 0 16px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  td.actions { display: flex; gap: 6px; flex-wrap: wrap; }
  code { font-size: .8rem; word-break: break-all; }
  .table-wrap { overflow-x: auto; }
  #status { min-height: 1.5em; color: var(--muted); margin-top: var(--space); }
  #status.error { color: var(--danger); }
  .empty { color: var(--muted); padding: var(--space) 0; }
</style>
</head>
<body>
<main>
  <h1>Disposable Browser</h1>
  <p class="lead">Private Chromium sessions with DuckDuckGo. Close a session and it is gone: no cookies, history, or cache survive.</p>

  <section aria-labelledby="auth-h">
    <h2 id="auth-h">API token</h2>
    <form id="auth" onsubmit="return false">
      <label>Bearer token (kept in this tab only)
        <input id="token" type="password" autocomplete="off" placeholder="DBROWSER_API_TOKEN">
      </label>
      <button type="button" id="save-token">Use token</button>
    </form>
  </section>

  <section aria-labelledby="new-h">
    <h2 id="new-h">New session</h2>
    <form id="create">
      <label>Agent / owner (optional)
        <input name="agent_id" pattern="[A-Za-z0-9][A-Za-z0-9_.\-]{0,63}" placeholder="e.g. grok-bot-1">
      </label>
      <label>Egress network
        <select name="network">
          <option value="direct">Direct</option>
          <option value="wireguard">WireGuard VPN</option>
          <option value="tailscale">Tailscale (exit node)</option>
        </select>
      </label>
      <label>WireGuard profile
        <input name="wireguard_profile" placeholder="profile name (for WireGuard)">
      </label>
      <label>Tailscale exit node
        <input name="tailscale_exit_node" placeholder="optional">
      </label>
      <label>Share live view via
        <select name="expose">
          <option value="none">Local only</option>
          <option value="cloudflare">Cloudflare Tunnel</option>
          <option value="tailscale">Tailscale Serve</option>
        </select>
      </label>
      <label>Lifetime (minutes)
        <input name="ttl" type="number" min="1" max="1440" value="60">
      </label>
      <label>Idle timeout (minutes, 0 = off)
        <input name="idle" type="number" min="0" max="1440" step="1" placeholder="server default">
      </label>
      <label>Ad &amp; tracker blocking
        <select name="adblock">
          <option value="">Server default</option>
          <option value="true">On (uBlock Origin Lite)</option>
          <option value="false">Off</option>
        </select>
      </label>
      <button class="primary" type="submit">Start fresh browser</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
  </section>

  <section aria-labelledby="list-h">
    <h2 id="list-h">Live sessions</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Agent</th><th>Network</th><th>Expires</th><th>CDP</th><th>Actions</th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const store = { get() { try { return sessionStorage.getItem("dbrowser-token") || ""; } catch { return ""; } },
                  set(v) { try { sessionStorage.setItem("dbrowser-token", v); } catch {} } };
  let token = store.get();
  $("#token").value = token;

  function status(msg, isError = false) { const el = $("#status"); el.textContent = msg; el.className = isError ? "error" : ""; }

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, ...(opts.headers || {}) } });
    if (res.status === 204) return null;
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail ? (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail)) : res.statusText);
    return body;
  }

  function cell(text) { const td = document.createElement("td"); td.textContent = text; return td; }

  async function refresh() {
    const rows = $("#rows");
    try {
      const sessions = await api("/v1/sessions");
      rows.replaceChildren();
      if (!sessions.length) { rows.innerHTML = '<tr><td colspan="6" class="empty">No live sessions. Start one above.</td></tr>'; return; }
      for (const s of sessions) {
        const tr = document.createElement("tr");
        tr.append(cell(s.id), cell(s.agent_id || "—"), cell(s.network + (s.expose !== "none" ? ` · ${s.expose}` : "")),
                  cell(new Date(s.expires_at).toLocaleTimeString() + (s.idle_timeout_seconds ? ` · idle ${Math.round(s.idle_timeout_seconds / 60)}m` : "")));
        const cdp = document.createElement("td"); const code = document.createElement("code"); code.textContent = s.cdp_url || "—"; cdp.append(code); tr.append(cdp);
        const actions = document.createElement("td"); actions.className = "actions";
        const open = document.createElement("button"); open.textContent = "Open";
        open.onclick = () => window.open(s.public_url || s.viewer_url, "_blank", "noopener");
        const kill = document.createElement("button"); kill.textContent = "Destroy"; kill.className = "danger";
        kill.onclick = async () => { if (!confirm(`Destroy session ${s.id}? Everything in it is deleted.`)) return;
          try { await api(`/v1/sessions/${s.id}`, { method: "DELETE" }); status(`Session ${s.id} destroyed.`); refresh(); } catch (e) { status(e.message, true); } };
        actions.append(open, kill); tr.append(actions); rows.append(tr);
      }
    } catch (e) {
      rows.innerHTML = '<tr><td colspan="6" class="empty"></td></tr>';
      rows.querySelector("td").textContent = token ? `Could not load sessions: ${e.message}` : "Enter your API token to see sessions.";
    }
  }

  $("#save-token").onclick = () => { token = $("#token").value.trim(); store.set(token); status("Token set."); refresh(); };

  $("#create").onsubmit = async (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target); const body = { network: f.get("network"), expose: f.get("expose"), ttl_seconds: Number(f.get("ttl")) * 60 };
    for (const k of ["agent_id", "wireguard_profile", "tailscale_exit_node"]) { const v = (f.get(k) || "").trim(); if (v) body[k] = v; }
    const idle = (f.get("idle") || "").trim(); if (idle !== "") body.idle_timeout_seconds = Number(idle) * 60;
    if (f.get("adblock")) body.adblock = f.get("adblock") === "true";
    const btn = ev.submitter; btn.disabled = true; status("Starting a fresh browser…");
    try {
      const s = await api("/v1/sessions", { method: "POST", body: JSON.stringify(body) });
      status(`Session ${s.id} ready.`); window.open(s.public_url || s.viewer_url, "_blank", "noopener"); refresh();
    } catch (e) { status(`Could not start: ${e.message}`, true); } finally { btn.disabled = false; }
  };

  refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
