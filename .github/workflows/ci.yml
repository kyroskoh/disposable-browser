name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: controller/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: shellcheck entrypoint
        run: shellcheck ../browser/entrypoint.sh ../scripts/*.sh

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: browser/Dockerfile
          failure-threshold: error
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: controller/Dockerfile
          failure-threshold: error

  e2e:
    needs: [lint-unit, hadolint]
    runs-on: ubuntu-latest
    env:
      DBROWSER_API_TOKEN: ci-${{ github.run_id }}-token-0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build images
        run: |
          docker compose --profile build build
          docker compose build controller
      - name: Start controller
        run: |
          echo "DBROWSER_API_TOKEN=${DBROWSER_API_TOKEN}" > .env
          mkdir -p wireguard
          docker compose up -d controller
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 2; done
      - name: Install test deps
        run: pip install -e "controller[dev]"
      - name: Smoke test (standalone image, no controller)
        run: bash scripts/smoke-standalone.sh
      - name: End-to-end tests
        run: pytest -m integration -v controller/tests/integration
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs controller
          for c in $(docker ps -aq --filter label=dbrowser.session); do docker logs "$c"; done
      - name: Tear down
        if: always()
        run: docker compose down -v
